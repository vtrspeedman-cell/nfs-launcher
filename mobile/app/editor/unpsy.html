const SLOT_LOCK_REL = 0x428;
/** Slot-relative "car bought" flag; zero on an unlocked slot means it is open for a sponsor car. */

 * See technical.md, "Dyno tuning", for the traced functions.

/** Slot-relative start of the five dyno setups. */
const TUNING_OFF = 0x354;
/** Bytes per dyno setup. */
const SETUP_SIZE = 41;
/** Number of dyno setups per car. */

const UNIQUE_REL = 0x2e8;

const CHUNK_TUNING = 0x34a1a;

const DT = 1 / 60;
const QUARTER_MILE_M = 400.5;

const RAD_PER_RPM = 0.10471204;
const GEAR_SPACING = 0.05;

const CURVE_EPSILON = 1e-4;

    [0, 'Front springs', 'suspension'], [1, 'Front shocks', 'suspension'],
    [2, 'Front sway bar', 'suspension'], [3, 'Front ride height', 'suspension'],
    [4, 'Rear springs', 'suspension'], [5, 'Rear shocks', 'suspension'],

const NM_TO_LBFT = 0.73756212;

 * B. dbExport/dbImport/dbMerge – base própria em JSON (aceita novos carros MOD sem mudar código)
 * C. paramReport() – parâmetros com nível de confiança (identificado / estimado / desconhecido)
 * D. ga()         – otimizador genético sobre a física validada do jogo (GLOBALB ou base JSON)
 * Regra: nada aqui inventa offsets; só usa o que o simulador original (validado) expõe. */
const UNPSY=(()=>{
const SZ=41,b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=h=>'0x'+(h>>>0).toString(16).toUpperCase().padStart(8,'0');
function dbExport(g,origin){return{format:'unpsy-db',v:1,origin:origin||'GLOBALB',created:new Date().toISOString(),
 cars:g.cars.map(c=>({index:c.index,name:c.name,hash:c.hash>>>0,rec:b64(new Uint8Array(c.view.buffer,c.view.byteOffset,c.view.byteLength))})),packages:g.packages,tuning:g.tuning}}
function dbImport(o){if(!o||o.format!='unpsy-db'||!Array.isArray(o.cars)||!o.packages||!o.tuning)throw Error('Arquivo não é uma base UNPSY válida');
 return{cars:o.cars.map(c=>({index:c.index,name:c.name,hash:c.hash>>>0,view:new DataView(unb64(c.rec).buffer)})),packages:o.packages,tuning:o.tuning}}
function sameRec(a,b){if(a.view.byteLength!=b.view.byteLength)return false;for(let i=0;i<a.view.byteLength;i++)if(a.view.getUint8(i)!=b.view.getUint8(i))return false;return true}
/** Une x em g. Carros novos entram; mesmo hash com bytes diferentes = "versão diferente" (relatado, não sobrescrito). */
function dbMerge(g,x){if(!g)return{game:x,added:x.cars.length,versions:[]};let added=0;const versions=[];
 for(const c of x.cars){const y=g.cars.find(k=>k.hash==c.hash);if(!y){g.cars.push(c);added++}else if(!sameRec(y,c))versions.push({hash:c.hash,name:c.name})}return{game:g,added,versions}}
function identify(hash,g,src){const c=g&&M.findCar(g,hash),o=src&&src[hash];return{id:'NFSU2-'+hex(hash).slice(2),hash,known:!!c,origin:c?(o||'GLOBALB'):'MOD sem dados físicos',name:c?c.name:null,index:c?c.index:null}}
const E=(g,n,f,s,d)=>({grupo:g,item:n,estado:s,fonte:f,valor:d});
function paramReport(m){const R={};m.scalarTuning(new Uint8Array(SZ).fill(100)).forEach(r=>R[r.param]=r);const ft=p=>R[p]?`${R[p].displayMin.toFixed(2)} – ${R[p].displayMax.toFixed(2)}`:'travado (faltam peças)';
 const n=m.evaluate(new Uint8Array(SZ).fill(100)),f=m.base.f,bias=f[0x1c0>>2],I='identificado',S='estimado',U='desconhecido';
 return[E('Motor','Potência/torque de pico','base do carro + física validada',I,`${(n.peakPower*M.KW_TO_HP).toFixed(0)} hp · ${n.peakTorque.toFixed(0)} N·m`),E('Motor','Curva de torque (9 pontos)','tabela do carro',I,'lida do registro'),
 E('Motor','ECU / Turbo ajustáveis','peças instaladas',I,(m.ecuTunable?'ECU ✓ ':'ECU ✗ ')+(m.turboTunable?'Turbo ✓':'Turbo ✗')),
 E('Transmissão','Câmbio e diferencial final','registro do carro',I,`${m.gearingParameters.length>1?m.gearingParameters.length-1:'?'} marchas ajustáveis`),E('Transmissão','Aceleração / velocidade final','simulador validado (40 casos do executável)',I,`0–60 ${n.t60.toFixed(2)} s · topo ${n.topSpeed.toFixed(0)} mph`),
 E('Tração','Tipo de tração','campo de distribuição de torque',I,bias<.25?'FWD':bias>.75?'RWD':'AWD'),
 E('Suspensão','Molas dianteira/traseira (faixa)','tabela de ajustes',I,ft(0)+' | '+ft(4)),E('Suspensão','Amortecedores (faixa)','tabela de ajustes',I,ft(1)+' | '+ft(5)),E('Suspensão','Barras estabilizadoras (faixa)','tabela de ajustes',I,ft(2)+' | '+ft(6)),
 E('Suspensão','Altura do veículo (faixa)','tabela de ajustes',I,ft(3)+' | '+ft(7)),E('Suspensão','Altura: sentido (alto/baixo)','não confirmado no código',U,'mantida no padrão'),
 E('Suspensão','Cambagem / Toe','sem campo no setup de 41 bytes',U,'indisponível'),
 E('Comportamento','Aderência dos pneus (faixa)','tabela de ajustes',I,ft(19)+' | '+ft(20)),E('Comportamento','Efeito da aderência no handling','sem modelo de pista',S,'receita por tração/evento'),
 E('Comportamento','Direção e balanço de freio','sentido não confirmado',U,'mantidos no padrão'),E('Comportamento','Distribuição de peso','campo não mapeado',U,'desconhecida'),
 E('Aerodinâmica','Downforce (faixa)','tabela de ajustes (precisa de spoiler/para-choques)',I,ft(21)+' | '+ft(22)),E('Comportamento','Estabilidade','sem modelo de pista',S,'estimativa por receita')]}
// ---- D. Genético ----
const OBJ={bal:'Equilibrada',accel:'Máxima aceleração',top:'Máxima velocidade final',stab:'Máxima estabilidade (estimativa)',circuit:'Circuito',drag:'Drag'};
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function metrics(m,s){const r=m.evaluate(s),f=m.tuned(s).f,T=[];for(let k=0;k<9;k++)T.push(f[(0x200>>2)+k]);const mean=T.reduce((a,b)=>a+b,0)/9,sd=Math.sqrt(T.reduce((a,b)=>a+(b-mean)**2,0)/9);
 return{r,mid:T.slice(2,8).reduce((a,b)=>a+b,0)/6,cv:sd/Math.max(mean,1e-9)}}
function costOf(obj,x,n){const r=x.r,q=r.quarterMile/n.r.quarterMile,a6=r.t60/n.r.t60,a1=r.t100/n.r.t100,tp=n.r.topSpeed/r.topSpeed,md=n.mid/Math.max(x.mid,1e-9);
 switch(obj){case'accel':return .5*a6+.5*a1;case'top':return tp;case'drag':return .85*q+.15*tp*.5+.1*a1*.5;case'circuit':return .35*a1+.2*tp+.45*md;
  case'stab':return .5*x.cv/Math.max(n.cv,1e-9)+.3*(n.r.peakPower/r.peakPower)+.2*a1;default:return .4*q+.3*a1+.3*tp}}
function ga(G,d){const car=M.findCar(G,d.hash);if(!car)throw Error('Carro sem dados físicos (GLOBALB/base)');const m=new M.DynoModel(G,car,d.inst,d.uni);
 const idx=[];if(m.ecuTunable)for(let k=23;k<32;k++)idx.push(k);if(m.turboTunable)for(let k=32;k<41;k++)idx.push(k);if(d.gear)for(const k of m.gearingParameters)idx.push(k);
 if(!idx.length)throw Error('ECU, turbo e câmbio bloqueados: instale as peças');const base=Uint8Array.from(d.setup),neu=new Uint8Array(SZ).fill(100),n=metrics(m,neu),R=rng(d.seed||12345),obj=d.obj||'bal';
 const mk=g=>{const s=base.slice();idx.forEach((k,j)=>s[k]=g[j]);return s},fit=g=>{try{return costOf(obj,metrics(m,mk(g)),n)}catch(e){return 1e9}};
 const P=d.pop||36,Gn=d.gens||25;let pop=[idx.map(k=>base[k]),idx.map(()=>100)];while(pop.length<P)pop.push(idx.map(()=>Math.floor(R()*201)));
 let sc=pop.map(fit),evals=P;const pick=()=>{let b=-1;for(let t=0;t<3;t++){const i=Math.floor(R()*P);if(b<0||sc[i]<sc[b])b=i}return pop[b]};
 for(let g=0;g<Gn;g++){const o=sc.map((c,i)=>i).sort((a,b)=>sc[a]-sc[b]),np=[o[0],o[1]].map(i=>pop[i]);while(np.length<P){const a=pick(),b=pick();np.push(a.map((v,j)=>{let x=R()<.5?v:b[j];if(R()<.15)x+=Math.round((R()-.5)*80);return Math.max(0,Math.min(200,x))}))}
  pop=np;sc=pop.map(fit);evals+=P}
 let bi=0;sc.forEach((c,i)=>{if(c<sc[bi])bi=i});const s=mk(pop[bi]);return{setup:s,before:m.evaluate(base),after:m.evaluate(s),evals,cost:sc[bi],objective:OBJ[obj]||obj}}
return{dbExport,dbImport,dbMerge,identify,paramReport,ga,OBJ,hex}})();

 <label><input type="checkbox" id="cb-lrn" ${c.learned?'checked':''}> usar meus testes</label></div>
 <div class="row" style="margin-top:8px"><button data-a="cbe-an">ANALISAR VEÍCULO</button><button class="pri" data-a="cbe-gen">GERAR BUILD</button><button data-a="cbe-cmp">COMPARAR BUILDS</button><button class="pri" data-a="cbe-apply" ${c.res?'':'disabled'}>APLICAR AO SAVE</button><button data-a="cbe-export" ${c.res?'':'disabled'}>EXPORTAR CONFIGURAÇÃO</button><button data-a="cbe-restore" ${c.prev?'':'disabled'}>RESTAURAR ANTERIOR</button></div>
 <p class="hint">Mostra o que é <b>simulado</b> (modelo físico do jogo, estimativa), o que vem de <b>referências</b> (documentadas) e o que é <b>hipótese</b>. Nada aqui é tempo real de pista.</p></div>`;
 if(c.diag){const d=c.diag;h+=`<div class="card"><h2>Diagnóstico · ${d.name} <span class="chip ${d.physicsLevel=='simulated'?'on':'g'}">${d.physicsLevel=='simulated'?'SIMULADO (há física)':'EXPERIMENTAL (sem física)'}</span> ${d.drivetrain?`<span class="chip">${d.drivetrain}</span>`:''}</h2><div class="row">${Object.entries(d.groups).map(([g,v])=>`<span class="chip ${v.installed?'on':''}">${GRP_PT[g]} ${v.installed}/${v.slots}</span>`).join('')}</div>
  <div class="row" style="margin-top:6px">${Object.entries(d.uniques).map(([g,v])=>`<span class="chip ${v?'g':''}">única ${GRP_PT[g]||g}: ${v?'sim':'não'}</span>`).join('')}</div>
  <p>ECU ${d.ecuTunable===null?'?':d.ecuTunable?'<span class="ok">ajustável</span>':'<span class="er">bloqueada</span>'} · Turbo ${d.turboTunable===null?'?':d.turboTunable?'<span class="ok">ajustável</span>':'<span class="er">bloqueado</span>'} · Câmbio ${d.gearing===null?'?':d.gearing?'<span class="ok">ajustável</span>':'<span class="wn">fixo</span>'} · Downforce ${d.aeroUnlocked?'<span class="ok">liberado</span>':'<span class="wn">travado</span>'}</p>
  ${d.warnings.concat(d.notes).map(w=>`<div class="hint wn">• ${w}</div>`).join('')}</div>`}
 const r=c.res;if(r){const a=r.comparison.before,b=r.comparison.after;
  h+=`<div class="card"><h2>Preparação recomendada · ${CBE.RACE_LABEL[r.raceType]} ${tierChip(r.reliability)} ${r.reference?`<span class="chip">referência: ${r.reference.id}</span>`:''}</h2>
  ${r.comparison.kind=='simulated'?`<table><tr><th>${r.comparison.note}</th><th>Atual</th><th>Recomendada</th></tr>${MET.map(([l,f])=>mrow(l,f,a,b)).join('')}</table>`:`<p class="wn">${r.comparison.note}</p>`}
  <h3>Justificativa técnica</h3>${r.log.map(x=>`<div class="hint">• ${x}</div>`).join('')}${r.search?`<div class="hint">Busca: estratégias ${r.search.strategies.map(s=>s.strategy+' ('+s.cost+')').join(', ')} · ${r.search.evaluations} avaliações no modelo físico</div>`:''}
  <h3>Alterações (${r.changes.length})</h3>${r.changes.length?`<table><tr><th>Campo</th><th>Atual</th><th>Recomendado</th></tr>${r.changes.map(x=>`<tr><td>${x.field}</td><td>${x.from}</td><td><b>${x.to}</b></td></tr>`).join('')}</table>`:'<p class="hint">Nenhuma alteração.</p>'}${r.justification.filter(x=>/Atenção|não simula/.test(x)).map(x=>`<div class="hint wn">• ${x}</div>`).join('')}</div>`}
 if(c.cmp)h+=`<div class="card"><h2>Comparar builds · ${CBE.RACE_LABEL[c.race]}</h2>${c.cmp.kind=='simulated'?`<table><tr><th></th>${c.cmp.rows.map(x=>`<th>${x.label}</th>`).join('')}</tr>${MET.map(([l,f])=>`<tr><td>${l}</td>${c.cmp.rows.map(x=>`<td>${f(x.metrics)}</td>`).join('')}</tr>`).join('')}</table><p class="hint">Valores simulados.</p>`:'<p class="wn">Sem modelo físico: não há comparação simulada.</p>'}</div>`;
 h+=`<div class="card"><h2>Base de conhecimento · ${nameOf(i)}</h2>${refs.length?`<table><tr><th>Modalidade</th><th>Confiabilidade</th><th>Fonte</th><th>Observações</th></tr>${refs.map(p=>`<tr><td>${CBE.RACE_LABEL[p.raceType]}</td><td>${tierChip(p.reliability)}</td><td class="hint">${p.source}${p.url?` · <a href="${p.url}" target="_blank" rel="noopener" style="color:var(--ac)">link</a>`:''}</td><td class="hint">${(p.notes||'').slice(0,160)}</td></tr>`).join('')}</table>`:'<p class="hint">Nenhum preset documentado para este carro: o motor usa médias por tração (hipótese C) ou a configuração atual.</p>'}
  <div class="row" style="margin-top:8px"><button data-a="cbe-kbi">Importar presets (.json)</button><button data-a="cbe-kbx">Exportar base</button></div></div>
 <div class="card"><h2>Calibração com testes reais</h2><p class="hint">Registre o que você mediu <b>no jogo</b> com o setup atual de ${CBE.RACE_LABEL[c.race]}. Deixe em branco o que não mediu.</p>
  <div class="row">${[['hp','HP'],['tq','Torque'],['t60','0–60 s'],['t100','0–100 s'],['top','Vel. máx'],['lap','Tempo de pista s']].map(([k,l])=>`<input id="cl-${k}" type="number" step="any" placeholder="${l}" style="width:105px">`).join('')}<input id="cl-res" type="text" placeholder="resultado (ex.: venci)" style="width:150px"><button class="pri" data-a="cbe-log">Registrar teste</button></div>
  ${tests.length?`<table style="margin-top:8px"><tr><th>Data</th><th>Modalidade</th><th>HP</th><th>0–100</th><th>Pista</th><th>Resultado</th><th>Erro do simulador</th></tr>${tests.slice(-8).map(t=>{const m=modelOf(i),e=m?CAL.simulationError(t,cbeAdapter(m)):null;return`<tr><td class="hint">${t.date.slice(0,10)}</td><td>${CBE.RACE_LABEL[t.raceType]}</td><td>${t.hp??'—'}</td><td>${t.t100??'—'}</td><td>${t.lapTime??'—'}</td><td>${t.result||'—'}</td><td class="hint">${e&&Object.keys(e).length?Object.entries(e).map(([k,v])=>k+' '+(v.erroPct>0?'+':'')+v.erroPct+'%').join(' · '):'—'}</td></tr>`}).join('')}</table>`:''}
  <div class="row" style="margin-top:8px"><button data-a="cbe-cx">Exportar testes</button><button data-a="cbe-ci">Importar testes</button><span class="hint">${CAL.tests.length} teste(s) · os presets de referência nunca são sobrescritos</span></div></div>`;
 return h};
const cbeSave=()=>{try{localStorage.setItem('cbeTests',JSON.stringify(CAL.toJSON()))}catch(e){toast('Testes só valem nesta sessão: exporte o JSON')}};
Object.assign(ACT,{
 'cbe-an':()=>{V.cbe.diag=CBE.analyzeVehicle(cbeVehicle(V.cbe.car));render()},
 'cbe-gen':()=>{const c=V.cbe,v=cbeVehicle(c.car);c.diag=CBE.analyzeVehicle(v);try{c.res=CBE.optimizeBuild(v,c.race,c.obj,{kb:KB,calibration:CAL,useLearned:c.learned,vehicleId:cbeId(c.car)})}catch(x){return toast('Erro: '+x.message)}toast('Build gerada ('+c.res.reliability+'). Revise antes de aplicar.');render()},
 'cbe-cmp':()=>{const c=V.cbe,v=cbeVehicle(c.car),slot=CBE.SLOT[c.race],b=[{label:'Atual',setup:[...v.setups[slot]]}];if(c.res&&c.res.raceType==c.race)b.push({label:'Recomendada',setup:c.res.setup});
  const ref=KB.find(v,c.race);if(ref&&ref.dyno&&ref.dyno.bytes)b.push({label:'Referência ('+ref.reliability+')',setup:ref.dyno.bytes});const ln=CAL.best(cbeId(c.car),c.race);if(ln)b.push({label:'Meu teste',setup:ln.testedConfig});c.cmp=CBE.compareBuilds(v,b);render()},
 'cbe-apply':()=>{const c=V.cbe,r=c.res;if(!r)return;const bad=validate().filter(x=>!x.ok);if(bad.length&&!confirm('Validação com avisos:\n'+bad.map(x=>'• '+x.t).join('\n')+'\nAplicar mesmo assim?'))return;
  if(r.setup.some(x=>!(x>=0&&x<=200)))return toast('Setup inválido: fora de 0–200');const slot=CBE.SLOT[r.raceType];c.prev={car:c.car,slot,bytes:[...S.W.subarray(so(c.car,slot),so(c.car,slot)+SZ)]};dynEdit([c.car],[slot],x=>x.set(Uint8Array.from(r.setup)),false);toast('Aplicado em '+CBE.RACE_LABEL[r.raceType]+'. Use RESTAURAR ANTERIOR ou ↶ para voltar.');render()},
 'cbe-restore':()=>{const p=V.cbe.prev;if(!p)return;dynEdit([p.car],[p.slot],x=>x.set(Uint8Array.from(p.bytes)),false);V.cbe.prev=null;toast('Configuração anterior restaurada');render()},
 'cbe-export':()=>{const r=V.cbe.res;if(!r)return;dl(new Blob([JSON.stringify({format:'cbe-config',v:1,vehicleId:cbeId(V.cbe.car),vehicle:nameOf(V.cbe.car),raceType:r.raceType,objective:r.objective,reliability:r.reliability,physicsLevel:r.physicsLevel,setup:r.setup,changes:r.changes,justification:r.justification,comparison:r.comparison,reference:r.reference,date:new Date().toISOString()},null,1)],{type:'application/json'}),'cbe_'+safe(nameOf(V.cbe.car))+'_'+r.raceType+'.json')},
 'cbe-log':()=>{const c=V.cbe,g=k=>{const v=$('#cl-'+k).value;return v===''?null:+v},slot=CBE.SLOT[c.race];try{CAL.add({vehicleName:nameOf(c.car),vehicleId:cbeId(c.car),raceType:c.race,previousConfig:c.prev&&c.prev.slot==slot?c.prev.bytes:null,testedConfig:[...S.W.subarray(so(c.car,slot),so(c.car,slot)+SZ)],hp:g('hp'),torque:g('tq'),t60:g('t60'),t100:g('t100'),topSpeed:g('top'),lapTime:g('lap'),result:$('#cl-res').value})}catch(x){return toast('Erro: '+x.message)}cbeSave();toast('Teste registrado');render()},
 'cbe-cx':()=>dl(new Blob([JSON.stringify({format:'cbe-tests',v:1,tests:CAL.toJSON()},null,1)]),'cbe_testes.json'),'cbe-ci':()=>{V.jsMode='cbe-tests';$('#fJs').click()},
 'cbe-kbi':()=>{V.jsMode='cbe-kb';$('#fJs').click()},'cbe-kbx':()=>dl(new Blob([JSON.stringify(KB.toJSON(),null,1)]),'cbe_presets.json')});
const _fjs=$('#fJs').onchange;$('#fJs').onchange=async e=>{if(V.jsMode=='cbe-tests'||V.jsMode=='cbe-kb'){const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(V.jsMode=='cbe-tests'){const n=CAL.merge(o.tests);cbeSave();toast(n+' teste(s) importado(s)')}else{let n=0;for(const p of Array.isArray(o)?o:[o]){KB.add(p);n++}toast(n+' preset(s) importado(s) (somente na sessão)')}render()}catch(x){toast('Erro: '+x.message)}V.jsMode=null;return}return _fjs(e)};
M_.addEventListener('change',e=>{const t=e.target,c=V.cbe;if(t.id=='cb-car'){c.car=+t.value;c.res=null;c.diag=null;c.cmp=null;c.prev=null;render()}else if(t.id=='cb-race'){c.race=t.value;c.res=null;c.cmp=null;render()}else if(t.id=='cb-obj'){c.obj=t.value;c.res=null;render()}else if(t.id=='cb-lrn')c.learned=t.checked});
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,chkpt,true));
$('#hUndo').onclick=()=>{undo();render();toast('Desfeito')};$('#hRev').onclick=()=>{if(confirm('Descartar TODAS as alterações desde que o arquivo foi aberto?')){chkpt();revert();render()}};$('#hSave').onclick=save;
window.addEventListener('beforeunload',e=>{if(S.W&&!same(S.W,S.orig)){e.preventDefault();e.returnValue=''}});
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{if(!e.defaultPrevented){e.preventDefault();openFiles([...e.dataTransfer.files])}});
initDonors().then(()=>render());idb('get').then(r=>{if(r){try{setGame(UNPSY.dbImport(JSON.parse(r)),'DATABASE',false);B.dbName='(salva no navegador)'}catch(e){}}});render();
</script></body></html>
